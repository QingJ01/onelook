name: Workbench CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:archify
      - run: pnpm test
      - run: pnpm build
